<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="AURA - Premium music downloader and car audio player for YouTube and YouTube Music" />
  <meta name="theme-color" content="#0a0a12" />
  <title>AURA — Music Downloader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ========== APP SHELL ========== -->
<div id="app">

  <!-- TOP BAR -->
  <header id="top-bar">
    <div id="logo">
      <span class="logo-icon">◈</span>
      <span class="logo-text">AURA</span>
    </div>
    <div id="top-actions">
      <button id="car-mode-btn" class="icon-btn" title="Car Mode" aria-label="Toggle Car Mode">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="3" width="15" height="13" rx="2"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>
        </svg>
      </button>
      <button id="ai-btn" class="icon-btn" title="AI Playlists" aria-label="Generate AI Playlists">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- MAIN CONTENT AREA -->
  <main id="main-content">

    <!-- ===== HOME TAB ===== -->
    <section id="tab-home" class="tab-section active">

      <!-- Download Card -->
      <div class="card" id="download-card">
        <h2 class="card-title">Download Music</h2>
        <p class="card-subtitle">Paste a YouTube or YouTube Music link below</p>

        <div id="url-input-row">
          <div id="url-input-wrap">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>
            </svg>
            <input type="url" id="url-input" placeholder="https://youtube.com/watch?v=..." autocomplete="off" autocorrect="off" spellcheck="false" />
            <button id="paste-btn" class="inline-btn" aria-label="Paste from clipboard">Paste</button>
          </div>
          <button id="inspect-btn" class="primary-btn" aria-label="Inspect Link">
            <span id="inspect-btn-text">Inspect</span>
            <span id="inspect-spinner" class="spinner hidden"></span>
          </button>
        </div>

        <!-- Track Preview (hidden until inspect) -->
        <div id="track-preview" class="hidden">
          <div id="preview-art-wrap">
            <img id="preview-thumb" src="" alt="Track thumbnail" />
            <div id="preview-art-overlay"></div>
          </div>
          <div id="preview-info">
            <div id="preview-title">—</div>
            <div id="preview-artist">—</div>

            <!-- Format Selection -->
            <div id="format-section">
              <label class="section-label">FORMAT</label>
              <div id="format-pills">
                <button class="format-pill active" data-format="mp3">MP3</button>
                <button class="format-pill" data-format="m4a">M4A</button>
                <button class="format-pill" data-format="flac">FLAC</button>
                <button class="format-pill" data-format="wav">WAV</button>
                <button class="format-pill" data-format="opus">OPUS</button>
              </div>
            </div>

            <button id="download-btn" class="download-action-btn" aria-label="Download track">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              <span id="download-btn-text">Download</span>
              <span id="download-spinner" class="spinner hidden"></span>
            </button>
          </div>
        </div>

        <!-- Status message -->
        <div id="status-msg" class="hidden"></div>
      </div>

      <!-- Quick Stats -->
      <div id="stats-row">
        <div class="stat-chip" id="stat-songs">
          <span class="stat-num" id="stat-songs-count">0</span>
          <span class="stat-label">Songs</span>
        </div>
        <div class="stat-chip" id="stat-size">
          <span class="stat-num" id="stat-size-val">—</span>
          <span class="stat-label">Library</span>
        </div>
        <div class="stat-chip" id="stat-formats">
          <span class="stat-num" id="stat-formats-val">—</span>
          <span class="stat-label">Formats</span>
        </div>
      </div>

    </section>

    <!-- ===== LIBRARY TAB ===== -->
    <section id="tab-library" class="tab-section hidden">
      <div id="library-header">
        <h2 class="section-title">Your Library</h2>
        <button id="refresh-library-btn" class="icon-btn-sm" aria-label="Refresh library">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/>
          </svg>
        </button>
      </div>
      <div id="library-list">
        <div id="library-empty" class="empty-state">
          <div class="empty-icon">♪</div>
          <p>No songs yet. Download one!</p>
        </div>
      </div>
    </section>

    <!-- ===== AI PLAYLISTS TAB ===== -->
    <section id="tab-ai" class="tab-section hidden">
      <div id="ai-header">
        <h2 class="section-title">AI Playlists</h2>
        <button id="gen-playlist-btn" class="primary-btn-sm" aria-label="Generate playlists">Generate</button>
      </div>
      <div id="playlists-list">
        <div id="playlists-empty" class="empty-state">
          <div class="empty-icon">✦</div>
          <p>Hit Generate to create smart playlists</p>
        </div>
      </div>
    </section>

  </main>

  <!-- ===== PLAYER DOCK ===== -->
  <div id="player-dock" class="hidden">
    <div id="player-thumb-wrap">
      <img id="player-thumb" src="" alt="" />
    </div>
    <div id="player-meta">
      <div id="player-title">—</div>
      <div id="player-artist">—</div>
    </div>
    <div id="player-controls">
      <button id="prev-btn" class="ctrl-btn" aria-label="Previous">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
      </button>
      <button id="play-btn" class="ctrl-btn play" aria-label="Play/Pause">
        <svg id="play-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <svg id="pause-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="hidden"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <button id="next-btn" class="ctrl-btn" aria-label="Next">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
      </button>
    </div>
    <!-- Progress bar -->
    <div id="progress-wrap">
      <div id="progress-bar">
        <div id="progress-fill"></div>
        <input type="range" id="progress-slider" min="0" max="100" value="0" aria-label="Seek" />
      </div>
      <div id="time-row">
        <span id="time-current">0:00</span>
        <span id="time-total">0:00</span>
      </div>
    </div>
  </div>

  <!-- ===== BOTTOM NAV ===== -->
  <nav id="bottom-nav">
    <button class="nav-btn active" data-tab="home" aria-label="Home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span class="nav-label">Home</span>
    </button>
    <button class="nav-btn" data-tab="library" aria-label="Library">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
      <span class="nav-label">Library</span>
    </button>
    <button class="nav-btn" data-tab="ai" aria-label="AI Playlists">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
      <span class="nav-label">AI Mix</span>
    </button>
  </nav>

  <!-- ===== CAR MODE OVERLAY ===== -->
  <div id="car-mode-overlay" class="hidden">
    <div id="car-header">
      <div id="car-logo">◈ AURA <span class="car-badge">CAR MODE</span></div>
      <button id="car-exit-btn" aria-label="Exit Car Mode">✕ Exit</button>
    </div>
    <div id="car-art-wrap">
      <img id="car-thumb" src="" alt="" />
      <div id="car-art-blur"></div>
    </div>
    <div id="car-meta">
      <div id="car-title">Not Playing</div>
      <div id="car-artist">—</div>
    </div>
    <div id="car-controls">
      <button id="car-prev" class="car-ctrl" aria-label="Previous">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
      </button>
      <button id="car-play" class="car-ctrl car-play-btn" aria-label="Play/Pause">
        <svg id="car-play-icon" width="48" height="48" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <svg id="car-pause-icon" width="48" height="48" viewBox="0 0 24 24" fill="currentColor" class="hidden"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <button id="car-next" class="car-ctrl" aria-label="Next">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
      </button>
    </div>
    <div id="car-progress-wrap">
      <div id="car-progress-bar">
        <div id="car-progress-fill"></div>
        <input type="range" id="car-progress-slider" min="0" max="100" value="0" aria-label="Seek" />
      </div>
      <div id="car-time-row">
        <span id="car-time-current">0:00</span>
        <span id="car-time-total">0:00</span>
      </div>
    </div>
  </div>

</div>

<!-- Hidden audio element -->
<audio id="audio-player" preload="metadata"></audio>

<script src="app.js"></script>
</body>
</html>
